version: '3.8'

services:
  ticket-booking-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cineconcert_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=production_jwt_secret_ticket_platform_2026
      - QR_SECRET=production_qr_hmac_secret_ticket_platform_2026
      - ENABLE_DEMO_LOGIN=true
      - HOLD_TTL_SECONDS=600
      - WAITLIST_OFFER_TTL_SECONDS=300
      - CLIENT_URL=http://localhost:5000
    volumes:
      - ticket_sqlite_data:/app/server/data

volumes:
  ticket_sqlite_data:
    driver: local
